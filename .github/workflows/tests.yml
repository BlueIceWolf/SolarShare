name: Tests
on:
  push:
    branches: [main, feature/initial-ha-integration]
  pull_request:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.14.2
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -p test_accounting.py -v
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests/ha -v
